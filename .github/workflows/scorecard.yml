name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 2"
  push:
    branches: [main]
  # So the scan can be run on demand. Without this the only ways to trigger
  # it are the weekly cron, a push to the default branch, or a branch
  # protection change, which makes a fix impossible to verify promptly.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # v2.4.0 pulled gcr.io/openssf/scorecard-action, a registry that stopped
      # serving pulls, so every scheduled run failed from 2026-09-01 onward.
      # v2.6.0 pulls ghcr.io/ossf/scorecard-action instead. Pinned by SHA: this
      # action publishes no floating major tag, so an exact reference is
      # unavoidable, and an exact version tag is precisely what rotted.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scorecard-results.sarif
